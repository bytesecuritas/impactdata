{% extends 'core/base.html' %}

{% block title %}Demande envoyée - {{ organisation.name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px; margin-top: 60px;">
    <div class="card text-center">
        <div class="card-body py-5">
            <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
            <h4 class="mt-3">Demande envoyée !</h4>
            <p class="text-muted mt-2">
                Votre demande d'adhésion à <strong>{{ organisation.name }}</strong> a bien été reçue.
                Un superviseur l'examinera prochainement et vous contactera.
            </p>
        </div>
    </div>
</div>
{% endblock %}
